<!Doctype html>
<meta charset = 'UTF-8'>
<html>
  <head><title>리스트에서 자료선택하기</title>
  <script>
    function drawImage()
    {
      let sel = document.getElementById('fruits'); // fix Id
      let img = document.getElementById('fimg');   // change Id
      img.src = sel.options[sel.selectedIndex].value; // 선택한 리스트에 따른 변경
    }
  </script>
  </head>
  <body>
    주제1. 내가 좋아하는 과일 선택<br>
    <form>
      <select id='fruits'onchange='drawImage()'>
        <option value='cherry.jpg'>체리</option>
        <option value='strawberry.jpg'>딸기</option>
        <option value='mandarin.jpg'>귤</option>
      </select>
      <img id='fimg' src='cherry.jpg' alt='체리' width=100 height=100>
    </form>
    
    주제2. 오늘 점심 메뉴 선택 <br>
      <form>
        <select id='fruits'onchange='drawImage()'>
          <option value='cherry.jpg'>체리</option>
          <option value='strawberry.jpg'>딸기</option>
          <option value='mandarin.jpg'>귤</option>
        </select>
      <img id='fimg' src='cherry.jpg' alt='체리' width=100 height=100>
    </form>
  </body>
</html>
